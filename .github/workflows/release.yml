name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm build
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tagged
        # semantic-release tags HEAD only when it published a new version.
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.tagged.outputs.released == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"
      - if: steps.tagged.outputs.released == 'true'
        # GitHub Packages requires the scope to match the repository owner.
        run: |
          npm pkg set name="@${GITHUB_REPOSITORY_OWNER}/som-otel"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
