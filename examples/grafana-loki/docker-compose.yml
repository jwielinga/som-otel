name: som-grafana-loki

services:
  loki:
    image: grafana/loki:3.5.2
    command: -config.file=/etc/loki/config.yaml
    ports:
      - '3100:3100'
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3100/ready']
      interval: 3s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:9090/-/ready']
      interval: 3s
      timeout: 3s
      retries: 30

  alloy:
    image: grafana/alloy:v1.10.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # deltatocumulative and the debug exporter are experimental in Alloy.
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    ports:
      - '4318:4318'
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: som-demo-only
      GF_USERS_ALLOW_SIGN_UP: 'true'
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: examples/grafana-loki/Dockerfile
    environment:
      VITE_OTLP_ENDPOINT: http://localhost:4318/v1/logs
      LOKI_PROXY_TARGET: http://loki:3100
      PROMETHEUS_PROXY_TARGET: http://prometheus:9090
    ports:
      - '8080:8080'
    depends_on:
      alloy:
        condition: service_started
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
